<!-- CONTACT -->
<section class="contact-form">
    <h2 class="section-title">CONTACT</h2>
    <div class="contact">

        <p>If you have any questions or would like to work together, feel free to reach out!
        <form action="/submit" method="POST"> 
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter Your Name" pattern="[a-zA-Z\s]+"  title="Only alphabets and spaces are allowed"><br>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" pattern="[a-z0-9._]+@[a-z0-9.-]+\.[a-z]{2,}$" required title="Enter a valid email address (example: name@gmail.com)"><br>
              
            </div>
             <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" placeholder="Enter Subject"><br>
               
             </div>  
                 
             <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Enter your Message"></textarea><br>
                <button type="submit">SUBMIT</button> 
            </div> 

            </form>
    </div>
</section>
